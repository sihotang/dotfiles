# Shared defaults for templates. Override machine-specific values in the local
# ~/.config/chezmoi/chezmoi.toml file.
ollamaHost: 127.0.0.1:11434
workspaceDir: Workspace
editor: "code --wait"
# Profiles map each profile name to the CLI tools and app integrations enabled
# for it.
# Configure per machine in ~/.config/chezmoi/chezmoi.toml.
profilesDir: ".config/profiles"
profiles: {}
