# The current version of the config schema
version: 1
# What protocol to use when performing git operations. Supported values: ssh, https
git_protocol: https
# What editor gh should run when creating issues, pull requests, etc. If blank, will refer to environment.
editor: {{ .editor | quote }}
# When to interactively prompt. This is a global config that cannot be overridden by hostname. Supported values: enabled, disabled
prompt: enabled
# Preference for editor-based interactive prompting. This is a global config that cannot be overridden by hostname. Supported values: enabled, disabled
prefer_editor_prompt: disabled
# A pager program to send command output to, e.g. "less". If blank, will refer to environment. Set the value to "cat" to disable the pager.
pager:
# Aliases allow you to create nicknames for gh commands
aliases:
    co: pr checkout
    pv: pr view
    prs: pr list
    issues: issue list
    rv: repo view
    runs: run list
{{ $profiles := (index . "profiles") | default dict }}
{{ $profilesDir := (index . "profilesDir") | default ".config/profiles" }}
{{- range $profile, $config := $profiles }}
  {{- $tools := $config }}
  {{- if not (kindIs "slice" $config) }}{{ $tools = index $config "tools" }}{{ end }}
  {{- if has "gh" $tools }}
    {{- $profileAlias := $profile }}
    {{- $ghConfig := dict }}
    {{- if kindIs "map" $config }}
      {{- $profileAlias = printf "%v" (index $config "alias" | default $profile) }}
      {{- $ghConfig = index $config "gh" | default dict }}
    {{- end }}
    {{- if not (kindIs "map" $ghConfig) }}{{ fail (printf "gh config for profile %q must be a table" $profile) }}{{ end }}
    {{- $gitEnabled := has "git" $tools }}
    {{- $gitName := "" }}
    {{- $gitEmail := "" }}
    {{- if and $gitEnabled (kindIs "map" $config) }}
      {{- $gitName = printf "%v" (index $config "name" | default "") }}
      {{- $gitEmail = printf "%v" (index $config "email" | default "") }}
      {{- $gitConfig := index $config "git" | default dict }}
      {{- if kindIs "map" $gitConfig }}
        {{- $gitName = printf "%v" (index $gitConfig "name" | default $gitName) }}
        {{- $gitEmail = printf "%v" (index $gitConfig "email" | default $gitEmail) }}
      {{- end }}
    {{- end }}
    {{- $gitConfigParameters := list }}
    {{- if $gitName }}{{ $gitConfigParameters = append $gitConfigParameters (printf "'user.name=%s'" $gitName) }}{{ end }}
    {{- if $gitEmail }}{{ $gitConfigParameters = append $gitConfigParameters (printf "'user.email=%s'" $gitEmail) }}{{ end }}
    {{- $gitConfigEnv := "" }}
    {{- if $gitConfigParameters }}{{ $gitConfigEnv = printf "GIT_CONFIG_PARAMETERS='%s' " (join " " $gitConfigParameters | replace "'" "'\\''") }}{{ end }}
    {{- if not (regexMatch "^[a-zA-Z0-9._-]+$" $profileAlias) }}{{ fail (printf "invalid profile alias %q for profile %q" $profileAlias $profile) }}{{ end }}
    {{- $ghAlias := $profileAlias }}
    {{- if regexMatch "^[0-9]+$" $ghAlias }}{{ $ghAlias = printf "%q" $ghAlias }}{{ end }}
    {{- printf "    %s: %s\n" $ghAlias (printf "!unset GH_TOKEN GITHUB_TOKEN GH_ENTERPRISE_TOKEN GITHUB_ENTERPRISE_TOKEN GIT_CONFIG_PARAMETERS; GH_CONFIG_DIR=\"$HOME/%s/%s/gh\" %sgh \"$@\"" $profilesDir $profile $gitConfigEnv | quote) }}
  {{- end }}
{{- end }}
# The path to a unix socket through which to send HTTP connections. If blank, HTTP traffic will be handled by net/http.DefaultTransport.
http_unix_socket:
# What web browser gh should use when opening URLs. If blank, will refer to environment.
browser:
# Whether to copy one-time OAuth device codes to the clipboard. Supported values: enabled, disabled
clipboard: enabled
# Whether to display labels using their RGB hex color codes in terminals that support truecolor. Supported values: enabled, disabled
color_labels: disabled
# Whether customizable, 4-bit accessible colors should be used. Supported values: enabled, disabled
accessible_colors: disabled
# Whether an accessible prompter should be used. Supported values: enabled, disabled
accessible_prompter: disabled
# Whether to use an animated spinner as a progress indicator. If disabled, a textual progress indicator is used instead. Supported values: enabled, disabled
spinner: enabled
